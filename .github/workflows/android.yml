name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions: write lets the job delete older debug APKs after uploading the new one.
permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 17 is the compile toolchain (jvmToolchain(17)); JDK 21 (listed last = default) runs Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      # Unsigned here (the upload key never leaves the owner's PCs), but R8, resource shrinking and
      # the bundle are checked on every change, for the phone and the watch.
      - name: Assemble release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --console=plain

      # The free plan's artifact storage is small (each debug APK is ~25 MB), so only main keeps a
      # downloadable APK, and only the newest one: older copies are deleted once it is uploaded.
      - name: Upload debug APK
        id: upload-apk
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: twangle-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Delete older debug APKs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=twangle-debug-apk" \
            -q ".artifacts[] | select(.id != $KEEP_ID) | .id" | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 3
