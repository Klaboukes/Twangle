name: Android CI

# Once a night, not after every merge: every change is checked locally before it lands (CLAUDE.md,
# Git & GitHub), so a run per merge only repeated that check and used up the free plan's 2,000
# minutes a month in one week (2026-10-16). The nightly run covers everything merged since the last
# successful run, and skips itself when that was only documentation. "Run workflow" builds at once.
# Also on every pull request from someone else's fork (since 2026-11-12, when the code went public):
# nobody runs the local check for them, and a public repository's minutes are free. The owner's
# own pull requests (branches in this repository, Dependabot's too) don't run it: the local run is
# their gate. `pull_request`, never `pull_request_target`: a fork's run gets a read-only token and
# no secrets, and GitHub holds a first-time contributor's run until the owner approves it.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # to find the last successful run

# Every action is pinned to a commit, its version in the comment (Phase 93): a tag can be moved, a
# commit can't, so what runs here changes only with a change to this file. Dependabot proposes the
# updates once a month as a pull request (.github/dependabot.yml, Phase 91); by hand, take the
# commit of its newest release tag (gh api repos/<owner>/<action>/commits/<tag> --jq .sha).
jobs:
  build:
    name: Build, test & lint
    # A pull request from a branch in this repository is skipped (see the head of the file).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a full run takes about 26 minutes

    steps:
      # No token left in .git/config for the steps after it: nothing here pushes, and gh below has
      # its own (GH_TOKEN).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Build when anything but documentation, skills, scripts or the website changed since the last
      # successful run (or there is none, or it was started by hand or by a pull request). scripts/ui-tests.sh counts:
      # LocalizationTest reads it (the unit tests' inputs in app/build.gradle.kts name every file they
      # read). No test reads website/. --no-renames lists a moved file at both its old and its new
      # path, so code moved into docs/ still counts as a change to the code.
      - name: Anything to build?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh run list --workflow android.yml --branch main --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            build=true
          elif git diff --no-renames --name-only "$last" HEAD \
            | awk '$0 == "scripts/ui-tests.sh" || !/\.md$|^docs\/|^\.claude\/|^scripts\/|^website\// { n++ }
                   END { exit (n == 0) }'; then
            build=true
          else
            build=false
            echo "Only documentation changed since $last: nothing to build."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # JDK 17 is the compile toolchain (jvmToolchain, root build.gradle.kts); JDK 21 (listed last = default) runs Gradle.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.build == 'true'

      # One Gradle call, not one a check: each call starts Gradle and configures the build again,
      # minutes the free plan counts (Phase 90). --continue runs the other checks after a failure,
      # so one night reports every failing one. The release build is unsigned here (the upload key
      # never leaves the owner's PCs), but R8, resource shrinking and the bundle are checked every
      # night, for the phone and the watch.
      - name: Test, lint, debug and release builds
        if: steps.changes.outputs.build == 'true'
        run: ./gradlew test lint assembleDebug assembleRelease bundleRelease --continue --console=plain

      # The free build for F-Droid and IzzyOnDroid (Phase 93): the phone app without Google Play's
      # rating library. Built in release mode, so its own R8 shrinking is checked too, with the guard
      # that stops it if a Google library comes in (app/build.gradle.kts). A call of its own, since
      # -Ptwangle.foss=true holds for a whole call; only :app is built again. It runs also when the
      # step before it failed (a test, say), so that night still says whether the free build holds.
      - name: Assemble the free release build
        if: ${{ !cancelled() && steps.changes.outputs.build == 'true' }}
        run: ./gradlew :app:assembleRelease -Ptwangle.foss=true --console=plain

      # No debug APK upload: nobody downloads it, and the free plan's artifact storage is small.
      - name: Upload reports on failure
        if: failure() && steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 3
