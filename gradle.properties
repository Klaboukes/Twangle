org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The languages Twangle ships, as Android resource qualifiers (e.g. de, pt-rBR, zh-rCN). The first is
# the default: its texts live in res/values/ (see app/src/main/res/resources.properties); every other
# one needs a res/values-<language>/strings.xml in each module that has texts. The phone and watch
# apps read this for localeFilters, so the per-app language list (Android 13+) shows exactly these,
# and LocalizationTest checks the folders and translations against it. Add a language here.
twangle.languages=en,nl,de,fr,es,it,pt-rBR,zh-rCN,ja,ko,hi,in,ru,tr,pl,ar

# The version of both apps, phone and watch, as major.minor.patch (each 0..99). The root
# build.gradle.kts turns it into the versionCode (major * 10000 + minor * 100 + patch; the watch adds
# 1,000,000). Raise it for every build that leaves this PC.
twangle.version=1.1.0
