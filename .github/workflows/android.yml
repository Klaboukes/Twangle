name: Android CI

# Only after a merge: every change is checked locally before it lands (CLAUDE.md, Git & GitHub),
# so a PR run would only duplicate this one.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 17 is the compile toolchain (jvmToolchain(17)); JDK 21 (listed last = default) runs Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      # Unsigned here (the upload key never leaves the owner's PCs), but R8, resource shrinking and
      # the bundle are checked on every change, for the phone and the watch.
      - name: Assemble release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --console=plain

      # No debug APK upload: nobody downloads it, and the free plan's artifact storage is small.
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 3
