// Types from modules the Compose compiler doesn't compile (:core:dsp is pure Kotlin/JVM) that are
// truly immutable: every property a val, nothing inside ever changed after construction. Named here
// so Compose compares them with equals() and skips a composable whose tuning or instrument hasn't
// changed, instead of counting them as changeable and redrawing it on every reading (Phase 89;
// docs/architecture/performance.md, *Only visible changes reach the main thread*). Add a type only if
// it stays immutable: a stable type that changes inside leaves the screen showing old values.
// Enums (Notation, Accidental, PitchClass, CommonTuning) are stable without being named.

// A tuning's notes and marks, its derived arrays made once in the constructor.
io.github.klaboukes.twangle.core.dsp.music.Tuning
// An instrument's id, string count, preset tunings and voice.
io.github.klaboukes.twangle.core.dsp.music.Instrument
// A MIDI note number (a value class over an Int).
io.github.klaboukes.twangle.core.dsp.music.Note
// What a lowered tuning is called (data classes of a Tuning, an enum or an Int).
io.github.klaboukes.twangle.core.dsp.music.LoweredName
